name: Build and Release All Platforms

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
          python scripts/sync_ui.py --check

  build-windows:
    needs: [test-backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow
      - run: |
          pyinstaller --noconfirm --onefile --windowed --icon "assets/icon.ico" --hidden-import _overlapped --name VideoIndirici --add-data "static;static" desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/VideoIndirici.exe

  build-macos:
    needs: [test-backend]
    runs-on: macos-15
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow
      - run: |
          pyinstaller --noconfirm --windowed --icon "assets/icon.png" --name VideoIndirici --add-data "static:static" desktop.py
          cd dist && zip -r VideoIndirici-macOS.zip VideoIndirici.app
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoIndirici-macOS.zip

  build-android:
    needs: [test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
            export ANDROID_KEYSTORE_PATH="$(pwd)/keystore.jks"
            gradle testReleaseUnitTest assembleRelease
            cp app/build/outputs/apk/release/app-release.apk VideoIndirici.apk
            rm -f keystore.jks
          else
            gradle testDebugUnitTest assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk VideoIndirici.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/VideoIndirici.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/windows-exe/VideoIndirici.exe
            artifacts/android-apk/VideoIndirici.apk
          generate_release_notes: true
