<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Video İndirici" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <title>Video İndirici — iOS</title>
  <link rel="stylesheet" href="./shared_ui.css" />
  <script src="./shared_ui.js"></script>
  <style>
    :root {
      --bg: #050811;
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --pink: #ec4899;
      --ok: #34d399;
      --err: #fb7185;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(99, 102, 241, 0.25), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(236, 72, 153, 0.18), transparent 45%),
        var(--bg);
      color: var(--text);
      padding: calc(18px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom));
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .header { text-align: center; padding: 4px 0; }
    .badges { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--border); color: var(--muted);
    }
    .badge.ok { color: #a7f3d0; border-color: rgba(52,211,153,0.35); background: rgba(16,185,129,0.12); }
    h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
    .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px; display: flex; flex-direction: column; gap: 10px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    input, select {
      width: 100%; background: rgba(5, 8, 17, 0.92); border: 1px solid var(--border);
      border-radius: 11px; padding: 11px 12px; color: var(--text); font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: rgba(129,140,248,0.65); }
    button, .btn-link {
      border: none; border-radius: 11px; padding: 11px 14px; font-size: 14px; font-weight: 700;
      cursor: pointer; color: white; white-space: nowrap; text-decoration: none; text-align: center;
    }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .btn-secondary { background: rgba(255,255,255,0.09); border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 8px 11px; font-size: 12.5px; }
    .prog-wrap { display: none; flex-direction: column; gap: 6px; }
    .prog-bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .prog-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #6366f1, #ec4899); transition: width .2s; }
    .prog-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .msg { font-size: 13px; line-height: 1.45; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .results { display: none; flex-direction: column; gap: 8px; }
    .res-item {
      display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 12px;
      background: rgba(5,8,17,0.65); border: 1px solid rgba(255,255,255,0.07);
    }
    .res-item img { width: 88px; height: 50px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
    .res-info { flex: 1; min-width: 0; }
    .res-title { font-size: 13px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .res-meta { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .info-card { display: none; gap: 10px; align-items: center; }
    .info-card img { width: 96px; height: 54px; object-fit: cover; border-radius: 9px; flex-shrink: 0; }
    .footer-links { display: flex; justify-content: center; align-items: center; padding: 4px; }
    .footer-links a { color: #a5b4fc; font-size: 12.5px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="badges">
        <span class="badge">YouTube & Medya</span>
        <span class="badge ok">Yerel & Bağımsız • v1.3.9</span>
      </div>
      <h1>Video İndirici</h1>
      <p class="sub">Access Key veya sunucu kurulumu olmadan doğrudan cihazınızda indirin.</p>
    </div>

    <div class="card">
      <input id="qInput" type="text" placeholder="Herhangi bir video/film sitesi URL'si yapıştırın veya YouTube'da arayın..." />
      <div class="row">
        <select id="qualitySelect">
          <option value="best">En İyi MP4</option>
          <option value="1080">1080p MP4</option>
          <option value="720">720p MP4</option>
          <option value="480">480p MP4</option>
          <option value="audio">Sadece Ses (M4A)</option>
        </select>
        <select id="ccSelect"></select>
        <select id="dubSelect"></select>
        <button id="searchBtn" type="button" class="btn-secondary">Ara</button>
        <button id="dlBtn" type="button" class="btn-primary">İndir</button>
      </div>

      <div id="infoCard" class="info-card">
        <img id="infoThumb" alt="" />
        <div class="res-info">
          <div id="infoTitle" class="res-title"></div>
          <div id="infoMeta" class="res-meta"></div>
        </div>
      </div>

      <div id="progWrap" class="prog-wrap">
        <div class="prog-meta">
          <span id="progStatus">Hazırlanıyor...</span>
          <span id="progPct">0%</span>
        </div>
        <div class="prog-bar"><div id="progFill" class="prog-fill"></div></div>
        <div id="statusMsg" class="msg"></div>
        <a id="saveFileBtn" class="btn-link btn-primary" style="display:none;" target="_blank" rel="noopener">Telefona Kaydet / Aç</a>
        <a id="saveSubBtn" class="btn-link btn-secondary" style="display:none;" target="_blank" rel="noopener">Altyazı (CC) İndir</a>
      </div>
    </div>

    <div id="resultsCard" class="card results"></div>

    <div class="footer-links">
      <a href="./index.html">← İndirme Sayfasına Dön</a>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    const RESOLVER_NODES = [
      "https://pipedapi.kavin.rocks",
      "https://pipedapi.adminforge.de",
      "https://pipedapi.r4fo.com",
      "https://api.piped.private.coffee"
    ];

    const qInput = document.getElementById("qInput");
    const qualitySelect = document.getElementById("qualitySelect");
    const ccSelect = document.getElementById("ccSelect");
    VideoIndiriciUI.populateLanguageSelect(ccSelect, "CC: Yok");
    const dubSelect = document.getElementById("dubSelect");
    VideoIndiriciUI.populateLanguageSelect(dubSelect, "Dublaj: Yok");
    const searchBtn = document.getElementById("searchBtn");
    const dlBtn = document.getElementById("dlBtn");
    const infoCard = document.getElementById("infoCard");
    const infoThumb = document.getElementById("infoThumb");
    const infoTitle = document.getElementById("infoTitle");
    const infoMeta = document.getElementById("infoMeta");
    const progWrap = document.getElementById("progWrap");
    const progStatus = document.getElementById("progStatus");
    const progPct = document.getElementById("progPct");
    const progFill = document.getElementById("progFill");
    const statusMsg = document.getElementById("statusMsg");
    const saveFileBtn = document.getElementById("saveFileBtn");
    const saveSubBtn = document.getElementById("saveSubBtn");
    const resultsCard = document.getElementById("resultsCard");

    function extractYoutubeId(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) return u.pathname.replace("/", "").slice(0, 11);
        if (u.searchParams.get("v")) return u.searchParams.get("v").slice(0, 11);
        const m = u.pathname.match(/\/(?:shorts|embed|live)\/([A-Za-z0-9_-]{11})/);
        if (m) return m[1];
      } catch (e) {}
      return null;
    }

    async function fetchFromNodes(path) {
      let lastErr = null;
      for (const base of RESOLVER_NODES) {
        try {
          const r = await fetch(`${base}${path}`, { signal: AbortSignal.timeout(7000) });
          if (r.ok) return await r.json();
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error("Video kaynağı çözümlenemedi.");
    }

    async function runSearchOrInfo() {
      const val = qInput.value.trim();
      if (!val) return;
      resultsCard.style.display = "none";
      resultsCard.innerHTML = "";
      infoCard.style.display = "none";
      progWrap.style.display = "flex";
      saveFileBtn.style.display = "none";
      progStatus.textContent = VideoIndiriciUI.isHttpUrl(val) ? "Video bilgileri alınıyor..." : "YouTube'da aranıyor...";
      progPct.textContent = "";
      progFill.style.width = "35%";
      statusMsg.className = "msg";
      statusMsg.textContent = "";

      try {
        if (VideoIndiriciUI.isHttpUrl(val)) {
          const vidId = extractYoutubeId(val);
          if (!vidId) {
            progWrap.style.display = "none";
            infoThumb.src = "";
            infoTitle.textContent = "Doğrudan Medya Bağlantısı";
            infoMeta.textContent = val;
            infoCard.style.display = "flex";
            return;
          }
          const data = await fetchFromNodes(`/streams/${encodeURIComponent(vidId)}`);
          progWrap.style.display = "none";
          infoThumb.src = data.thumbnailUrl || "";
          infoTitle.textContent = data.title || "Video";
          infoMeta.textContent = `YouTube • ${data.uploader || ""} • ${VideoIndiriciUI.formatDuration(data.duration)}`;
          infoCard.style.display = "flex";
        } else {
          const data = await fetchFromNodes(`/search?q=${encodeURIComponent(val)}&filter=videos`);
          progWrap.style.display = "none";
          const items = (data.items || []).filter((x) => x.type === "stream").slice(0, 15).map((x) => ({
            title: x.title,
            url: `https://www.youtube.com${x.url}`,
            uploader: x.uploaderName || "YouTube",
            duration: x.duration || 0,
            thumbnail: x.thumbnail || ""
          }));
          if (!items.length) {
            statusMsg.className = "msg err";
            statusMsg.textContent = "Sonuç bulunamadı.";
            progWrap.style.display = "flex";
            return;
          }
          resultsCard.style.display = "flex";
          VideoIndiriciUI.renderSearchResults(resultsCard, items, {
            rowClass: "res-item",
            infoClass: "res-info",
            titleClass: "res-title",
            metaClass: "res-meta",
            btnClass: "btn-primary btn-sm",
            onDownload: (it) => {
              qInput.value = it.url;
              startDownload(it.url);
            },
            onSelect: (it) => {
              qInput.value = it.url;
              resultsCard.style.display = "none";
            }
          });
        }
      } catch (err) {
        progStatus.textContent = "Hata";
        progFill.style.width = "0%";
        statusMsg.className = "msg err";
        statusMsg.textContent = err.message || "İşlem başarısız.";
      }
    }

    function pickStream(streams, quality) {
      if (!Array.isArray(streams) || !streams.length) return null;
      const sorted = [...streams].sort((a, b) => (b.height || 0) - (a.height || 0));
      if (quality === "best") return sorted[0];
      const target = parseInt(quality, 10);
      return sorted.find((s) => (s.height || 0) <= target) || sorted[sorted.length - 1];
    }

    async function startDownload(overrideUrl) {
      const val = (overrideUrl || qInput.value).trim();
      if (!val) return;
      if (!VideoIndiriciUI.isHttpUrl(val)) {
        runSearchOrInfo();
        return;
      }

      progWrap.style.display = "flex";
      saveFileBtn.style.display = "none";
      saveSubBtn.style.display = "none";
      progStatus.textContent = "Akış hazırlanıyor...";
      progPct.textContent = "40%";
      progFill.style.width = "40%";
      statusMsg.className = "msg";
      statusMsg.textContent = "";
      dlBtn.disabled = true;

      try {
        const vidId = extractYoutubeId(val);
        let targetUrl = val;
        let title = "Video";
        let subUrl = "";

        if (vidId) {
          const data = await fetchFromNodes(`/streams/${encodeURIComponent(vidId)}`);
          title = data.title || "Video";
          const q = qualitySelect.value;
          if (q === "audio") {
            const audio = (data.audioStreams || []).sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0))[0];
            if (!audio || !audio.url) throw new Error("Ses akışı bulunamadı.");
            targetUrl = audio.url;
          } else {
            const muxed = (data.videoStreams || []).filter((s) => !s.videoOnly);
            const chosen = pickStream(muxed, q) || pickStream(data.videoStreams || [], q);
            if (!chosen || !chosen.url) throw new Error("Video akışı bulunamadı.");
            targetUrl = chosen.url;
          }
          const wantSub = (ccSelect.value || "").toLowerCase();
          if (wantSub && Array.isArray(data.subtitles)) {
            const match = data.subtitles.find((s) => (s.code || "").toLowerCase() === wantSub)
              || data.subtitles.find((s) => (s.code || "").toLowerCase().startsWith(wantSub));
            if (match && match.url) subUrl = match.url;
          }
        }

        progFill.style.width = "100%";
        progPct.textContent = "100%";
        progStatus.textContent = "Hazır!";
        saveFileBtn.href = targetUrl;
        saveFileBtn.style.display = "block";
        if (subUrl) {
          saveSubBtn.href = subUrl;
          saveSubBtn.style.display = "block";
        }
        statusMsg.className = "msg ok";
        statusMsg.textContent = `Hazır: ${title}. Kaydetmek için aşağıdaki butona dokunun.`;

        const a = document.createElement("a");
        a.href = targetUrl;
        a.target = "_blank";
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        progStatus.textContent = "Hata";
        progFill.style.width = "0%";
        statusMsg.className = "msg err";
        statusMsg.textContent = err.message || "İndirme hazırlanamadı.";
      } finally {
        dlBtn.disabled = false;
      }
    }

    searchBtn.addEventListener("click", runSearchOrInfo);
    dlBtn.addEventListener("click", () => startDownload());
  </script>
</body>
</html>
