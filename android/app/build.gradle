plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "com.videoindirici.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.videoindirici.app"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "yt-dlp"
        }
    }
}

dependencies {
}
