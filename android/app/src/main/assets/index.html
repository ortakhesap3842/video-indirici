<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Video İndirici</title>
  <link rel="stylesheet" href="./shared_ui.css" />
  <script src="./shared_ui.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(17, 24, 39, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
      --success: #22c55e;
      --error: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(99, 102, 241, 0.22), transparent 45%), var(--bg);
      color: var(--text);
      padding: 20px 14px 40px;
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .head { text-align: center; }
    .badges { display: inline-flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
    .badge { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.04); }
    .badge.yt { color: #fca5a5; border-color: rgba(239,68,68,0.35); }
    .badge.ig { color: #f9a8d4; border-color: rgba(236,72,153,0.35); }
    .badge.ok { color: #86efac; border-color: rgba(34,197,94,0.35); }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
    .sub { font-size: 13px; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    input {
      width: 100%;
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 14px;
      color: var(--text);
      font-size: 14.5px;
      outline: none;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .select-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .btn-row { display: flex; gap: 8px; }
    .btn-row button { flex: 1; }
    select {
      width: 100%;
      min-width: 0;
      background: #050811;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 12.5px;
    }
    button {
      border: none;
      border-radius: 11px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: var(--accent);
      cursor: pointer;
    }
    button.sec { background: rgba(255,255,255,0.1); }
    button:disabled { opacity: 0.55; }
    .preview { display: none; gap: 12px; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .preview.visible { display: flex; }
    .preview img { width: 108px; height: 62px; object-fit: cover; border-radius: 8px; background: #1e293b; flex-shrink: 0; }
    .preview h3 { font-size: 13.5px; margin-bottom: 3px; }
    .preview p { font-size: 12px; color: var(--muted); }
    .results { display: none; flex-direction: column; gap: 8px; max-height: 360px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 12px; }
    .results.visible { display: flex; }
    .res-item { display: flex; gap: 10px; align-items: center; background: rgba(5,8,17,0.65); border: 1px solid var(--border); border-radius: 11px; padding: 8px; }
    .res-item img { width: 88px; height: 52px; object-fit: cover; border-radius: 7px; flex-shrink: 0; }
    .res-meta { flex: 1; min-width: 0; }
    .res-meta h4 { font-size: 13px; line-height: 1.3; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .res-meta p { font-size: 11.5px; color: var(--muted); }
    .prog { display: none; flex-direction: column; gap: 8px; background: rgba(5,8,17,0.7); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
    .prog.visible { display: flex; }
    .prog-top { display: flex; justify-content: space-between; font-size: 12.5px; }
    .bar-bg { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #ec4899); transition: width 0.2s; }
    .msg { font-size: 12.5px; color: var(--muted); word-break: break-word; }
    .msg.ok { color: var(--success); }
    .msg.err { color: var(--error); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="badges">
        <span class="badge yt">YouTube</span>
        <span class="badge ig">Instagram</span>
        <span class="badge ok">Bağımsız • v1.4.4</span>
      </div>
      <h1>Video İndirici</h1>
      <p class="sub">Bilgisayara gerek duymadan doğrudan telefonunuza indirin.</p>
    </div>

    <div id="updateBanner" class="card" style="display:none; flex-direction:column; gap:8px; background:rgba(99,102,241,0.18); border-color:rgba(129,140,248,0.45);">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;">
        <span id="updateText" style="font-size:13px; font-weight:600;">Yeni sürüm mevcut!</span>
        <a id="updateLink" href="#" style="background:#6366f1; color:white; text-decoration:none; padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:700; white-space:nowrap;">Güncelle</a>
      </div>
      <div id="updateProgWrap" style="display:none; width:100%; height:6px; background:rgba(255,255,255,0.12); border-radius:999px; overflow:hidden;">
        <div id="updateProgFill" style="width:0%; height:100%; background:#6366f1; transition:width .2s;"></div>
      </div>
    </div>

    <div class="card">
      <input id="qInput" type="text" placeholder="Herhangi bir video/film sitesi URL'si yapıştırın veya YouTube'da arayın..." />
      <div class="select-grid">
        <select id="qualitySelect">
          <option value="best">En İyi MP4</option>
          <option value="720">720p MP4</option>
          <option value="480">480p MP4</option>
          <option value="audio">Sadece Ses (M4A)</option>
        </select>
        <select id="ccSelect"></select>
        <select id="dubSelect"></select>
      </div>
      <div class="btn-row">
        <button id="searchBtn" class="sec" type="button">Ara / Önizle</button>
        <button id="dlBtn" type="button">İndir</button>
      </div>

      <div id="previewBox" class="preview">
        <img id="thumbImg" src="" alt="" />
        <div>
          <h3 id="vTitle"></h3>
          <p id="vSub"></p>
        </div>
      </div>

      <div id="resultsBox" class="results"></div>

      <div id="progBox" class="prog">
        <div class="prog-top">
          <span id="progLabel">Hazırlanıyor...</span>
          <span id="progPct">0%</span>
        </div>
        <div class="bar-bg"><div id="progBar" class="bar-fill"></div></div>
        <div id="statusMsg" class="msg"></div>
      </div>

      <div id="playerBox" style="display:none; margin-top:4px; flex-direction:column; gap:8px;">
        <video id="ccVideo" controls playsinline style="width:100%; border-radius:12px; background:#000; max-height:260px;">
          <track id="ccTrack" kind="subtitles" label="Altyazı (CC)" default />
        </video>
      </div>
    </div>
  </div>

  <script>
    const qInput = document.getElementById("qInput");
    const qualitySelect = document.getElementById("qualitySelect");
    const ccSelect = document.getElementById("ccSelect");
    VideoIndiriciUI.populateLanguageSelect(ccSelect, "CC: Yok");
    const dubSelect = document.getElementById("dubSelect");
    VideoIndiriciUI.populateLanguageSelect(dubSelect, "Dublaj: Yok");
    const searchBtn = document.getElementById("searchBtn");
    const dlBtn = document.getElementById("dlBtn");
    const previewBox = document.getElementById("previewBox");
    const thumbImg = document.getElementById("thumbImg");
    const vTitle = document.getElementById("vTitle");
    const vSub = document.getElementById("vSub");
    const resultsBox = document.getElementById("resultsBox");
    const progBox = document.getElementById("progBox");
    const progLabel = document.getElementById("progLabel");
    const progPct = document.getElementById("progPct");
    const progBar = document.getElementById("progBar");
    const statusMsg = document.getElementById("statusMsg");

    function setBusy(busy) {
      searchBtn.disabled = busy;
      dlBtn.disabled = busy;
    }

    function runSearchOrInfo() {
      const val = qInput.value.trim();
      if (!val) return;
      setBusy(true);
      resultsBox.classList.remove("visible");
      previewBox.classList.remove("visible");
      if (/^https?:\/\//i.test(val)) {
        searchBtn.textContent = "Yükleniyor...";
        AndroidApp.getInfo(val);
      } else {
        searchBtn.textContent = "Aranıyor...";
        AndroidApp.search(val, 25);
      }
    }

    function startDl(urlOverride) {
      const val = (urlOverride || qInput.value).trim();
      if (!val) return;
      if (!/^https?:\/\//i.test(val)) {
        runSearchOrInfo();
        return;
      }
      setBusy(true);
      progBox.classList.add("visible");
      progBar.style.width = "0%";
      progPct.textContent = "0%";
      progLabel.textContent = "İndirme başlatılıyor...";
      statusMsg.className = "msg";
      statusMsg.textContent = "";
      if (AndroidApp.downloadWithOptions) {
        AndroidApp.downloadWithOptions(val, qualitySelect.value, ccSelect.value || "", dubSelect.value || "");
      } else if (AndroidApp.downloadWithSubtitle) {
        AndroidApp.downloadWithSubtitle(val, qualitySelect.value, ccSelect.value || "");
      } else {
        AndroidApp.download(val, qualitySelect.value);
      }
    }

    window.onSearchResults = function(jsonStr) {
      setBusy(false);
      searchBtn.textContent = "Ara / Önizle";
      const data = JSON.parse(jsonStr);
      resultsBox.innerHTML = "";
      if (!data.ok) {
        progBox.classList.add("visible");
        statusMsg.className = "msg err";
        statusMsg.textContent = data.error || "Arama başarısız.";
        return;
      }
      VideoIndiriciUI.renderSearchResults(resultsBox, data.results, {
        rowClass: "res-item",
        infoClass: "res-meta",
        titleTag: "h4",
        metaTag: "p",
        dlBtnStyle: "padding:8px 12px; font-size:12.5px;",
        onDownload: (item) => {
          qInput.value = item.url;
          resultsBox.classList.remove("visible");
          startDl(item.url);
        }
      });
      resultsBox.classList.add("visible");
    };

    window.onVideoInfo = function(jsonStr) {
      setBusy(false);
      searchBtn.textContent = "Ara / Önizle";
      const data = JSON.parse(jsonStr);
      if (!data.ok) {
        progBox.classList.add("visible");
        statusMsg.className = "msg err";
        statusMsg.textContent = data.error || "Bilgi alınamadı.";
        return;
      }
      thumbImg.src = data.thumbnail || "";
      vTitle.textContent = data.title;
      vSub.textContent = `${data.platform} • ${data.uploader}`;
      previewBox.classList.add("visible");
    };

    window.onDownloadProgress = function(pct, text) {
      progBar.style.width = `${pct}%`;
      progPct.textContent = `${pct}%`;
      progLabel.textContent = text;
    };

    window.onDownloadDone = function(jsonStr) {
      setBusy(false);
      const data = JSON.parse(jsonStr);
      if (data.ok) {
        progBar.style.width = "100%";
        progPct.textContent = "100%";
        progLabel.textContent = "Tamamlandı!";
        statusMsg.className = "msg ok";
        statusMsg.textContent = `Kaydedildi: ${data.saved_path || data.filename}`;
        const playerBox = document.getElementById("playerBox");
        const ccVideo = document.getElementById("ccVideo");
        const ccTrack = document.getElementById("ccTrack");
        if (data.video_uri) {
          ccVideo.src = data.video_uri;
          if (data.vtt_text) {
            const vttBlob = new Blob([data.vtt_text], { type: "text/vtt" });
            ccTrack.src = URL.createObjectURL(vttBlob);
          } else {
            ccTrack.removeAttribute("src");
          }
          playerBox.style.display = "flex";
          if (ccVideo.textTracks && ccVideo.textTracks[0]) {
            ccVideo.textTracks[0].mode = data.vtt_text ? "showing" : "disabled";
          }
        }
      } else {
        progLabel.textContent = "Hata";
        statusMsg.className = "msg err";
        statusMsg.textContent = data.error || "İndirme başarısız.";
      }
    };

    searchBtn.addEventListener("click", runSearchOrInfo);
    dlBtn.addEventListener("click", () => startDl());

    const CURRENT_VER = "1.4.4";
    let updateBusy = false;

    window.onUpdateProgress = (pct, text) => {
      document.getElementById("updateProgWrap").style.display = "block";
      document.getElementById("updateProgFill").style.width = `${Math.max(0, Math.min(100, pct))}%`;
      if (text) document.getElementById("updateText").textContent = text;
    };

    window.onUpdateStatus = (state, msg) => {
      const link = document.getElementById("updateLink");
      if (msg) document.getElementById("updateText").textContent = msg;
      if (state === "downloading" || state === "installing") {
        updateBusy = true;
        link.style.opacity = "0.6";
        link.textContent = state === "downloading" ? "İndiriliyor..." : "Kuruluyor...";
        document.getElementById("updateProgWrap").style.display = "block";
      } else {
        updateBusy = false;
        link.style.opacity = "1";
        link.textContent = "Güncelle";
        if (state === "error" || state === "need_permission") {
          document.getElementById("updateProgWrap").style.display = "none";
        }
      }
    };

    fetch("https://ortakhesap3842.github.io/video-indirici/version.json?t=" + Date.now())
      .then((r) => r.json())
      .then((d) => {
        if (d.version && d.version !== CURRENT_VER && d.downloads && d.downloads.android) {
          document.getElementById("updateText").textContent = `Yeni sürüm: v${d.version}`;
          const link = document.getElementById("updateLink");
          link.href = d.downloads.android;
          link.addEventListener("click", (e) => {
            e.preventDefault();
            if (updateBusy) return;
            if (window.AndroidApp && AndroidApp.installUpdate) {
              AndroidApp.installUpdate(d.downloads.android);
            } else if (window.AndroidApp && AndroidApp.openExternal) {
              AndroidApp.openExternal(d.downloads.android);
            } else {
              window.location.href = d.downloads.android;
            }
          });
          document.getElementById("updateBanner").style.display = "flex";
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
