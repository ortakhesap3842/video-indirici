<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Video İndirici — Telefon Galerisi</title>
  <style>
    :root {
      --bg: #070b14;
      --card: rgba(17, 24, 39, 0.9);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #6366f1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(99, 102, 241, 0.2), transparent 45%), var(--bg);
      color: var(--text);
      padding: 18px 14px 40px;
    }
    .wrap { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
    }
    h1 { font-size: 20px; font-weight: 800; }
    .refresh-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .player-card {
      display: none;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      flex-direction: column;
      gap: 10px;
    }
    .player-card.visible { display: flex; }
    .player-title { font-size: 14px; font-weight: 600; word-break: break-word; }
    video, audio { width: 100%; border-radius: 12px; background: #000; max-height: 60vh; }
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .item-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .item-name { font-size: 14px; font-weight: 600; word-break: break-word; line-height: 1.35; }
    .item-size { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .actions { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      text-align: center;
      text-decoration: none;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      background: var(--accent);
    }
    .btn.sec { background: rgba(255, 255, 255, 0.09); color: var(--text); }
    .empty { text-align: center; color: var(--muted); padding: 36px 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>İndirilen Videolar</h1>
      <button id="refreshBtn" class="refresh-btn" type="button">Yenile</button>
    </div>

    <div id="playerCard" class="player-card">
      <div id="playerTitle" class="player-title"></div>
      <div id="mediaSlot"></div>
    </div>

    <div id="list" class="list">
      <div class="empty">Yükleniyor...</div>
    </div>
  </div>

  <script>
    const listEl = document.getElementById("list");
    const playerCard = document.getElementById("playerCard");
    const playerTitle = document.getElementById("playerTitle");
    const mediaSlot = document.getElementById("mediaSlot");
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token") || "";
    const tokenQ = token ? `token=${encodeURIComponent(token)}` : "";

    function playFile(name) {
      const url = `/api/file/${encodeURIComponent(name)}${tokenQ ? "?" + tokenQ : ""}`;
      const isAudio = name.toLowerCase().endsWith(".mp3") || name.toLowerCase().endsWith(".m4a");
      playerTitle.textContent = name;
      mediaSlot.innerHTML = "";
      const mediaEl = document.createElement(isAudio ? "audio" : "video");
      mediaEl.controls = true;
      mediaEl.autoplay = true;
      if (!isAudio) mediaEl.playsInline = true;
      mediaEl.src = url;
      mediaSlot.appendChild(mediaEl);
      playerCard.classList.add("visible");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadFiles() {
      try {
        const res = await fetch(`/api/downloads${tokenQ ? "?" + tokenQ : ""}`);
        if (!res.ok) throw new Error("Yetkisiz");
        const data = await res.json();
        listEl.innerHTML = "";
        if (!data.files || data.files.length === 0) {
          listEl.innerHTML = `<div class="empty">Henüz indirilen video yok.</div>`;
          return;
        }
        for (const f of data.files) {
          const card = document.createElement("div");
          card.className = "item";

          const head = document.createElement("div");
          head.className = "item-head";
          const nameSpan = document.createElement("span");
          nameSpan.className = "item-name";
          nameSpan.textContent = f.name;
          const sizeSpan = document.createElement("span");
          sizeSpan.className = "item-size";
          sizeSpan.textContent = `${f.size_mb} MB`;
          head.appendChild(nameSpan);
          head.appendChild(sizeSpan);

          const actions = document.createElement("div");
          actions.className = "actions";

          const playBtn = document.createElement("button");
          playBtn.className = "btn";
          playBtn.type = "button";
          playBtn.textContent = "Aç / İzle";
          playBtn.addEventListener("click", () => playFile(f.name));

          const dlLink = document.createElement("a");
          dlLink.className = "btn sec";
          dlLink.href = `/api/file/${encodeURIComponent(f.name)}?download=1${tokenQ ? "&" + tokenQ : ""}`;
          dlLink.textContent = "Telefona Kaydet";

          actions.appendChild(playBtn);
          actions.appendChild(dlLink);
          card.appendChild(head);
          card.appendChild(actions);
          listEl.appendChild(card);
        }
      } catch (e) {
        listEl.innerHTML = `<div class="empty">Liste yüklenemedi.</div>`;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadFiles);
    loadFiles();
  </script>
</body>
</html>
